	<script nonce="a34g29914">
(function () {

  function attachHandler(form) {
    if (!form || form.dataset.bgBound) return;
    form.dataset.bgBound = "true";

    const emailInput = form.querySelector('#mailing-email');
    const phoneInput = form.querySelector('#mailing-phone');

    form.addEventListener('submit', function () {
      const email = emailInput?.value?.trim();
      const phone = phoneInput?.value?.trim();

      if (!email && !phone) return;

      // fire in background, don't block UI
      fetch('https://cgnew.wpengine.com/apis/howlny/list', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, phone }),
        keepalive: true // 🔥 ensures it still fires if page changes
      }).catch(err => {
        console.error('Background submit failed:', err);
      });

    }, true); // 🔥 capture phase so it runs BEFORE React
  }

  function scan() {
    const form = document.querySelector('form');
    if (form) attachHandler(form);
  }

  // initial scan
  scan();

  // watch for React rendering
  const observer = new MutationObserver(scan);
  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>
